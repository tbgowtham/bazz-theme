# ===================================================================
# Slick Greeter (LightDM) Configuration for Ubuntu-Cinnamon-White
# Place in: /etc/lightdm/slick-greeter.conf
# ===================================================================

[Greeter]
background=/usr/share/backgrounds/ubuntu-cinnamon-minimal-light.png
theme-name=Ubuntu-Cinnamon-White
icon-theme-name=Ubuntu-Cinnamon-Orange-Icons
font-name=Ubuntu 11
draw-user-backgrounds=false
draw-grid=false
show-hostname=false
show-clock=true
clock-format=%A, %B %d  %l:%M %p
enable-hidpi=auto
onscreen-keyboard=false
