# ===================================================================
# Slick Greeter (LightDM) Configuration for Dracula-Slim
# Place in: /etc/lightdm/slick-greeter.conf
# ===================================================================

[Greeter]
background=/usr/share/backgrounds/dracula-cyberpunk-cockpit.png
theme-name=Dracula-Slim
icon-theme-name=Dessert-white
font-name=Ubuntu 11
draw-user-backgrounds=false
draw-grid=false
show-hostname=false
show-clock=true
clock-format=%A, %B %d  %l:%M %p
enable-hidpi=auto
onscreen-keyboard=false
